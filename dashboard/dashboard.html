<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberShield AI – Dashboard</title>
  <link rel="icon" href="/static/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black text-white min-h-screen flex flex-col p-6">

  <header class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-extrabold tracking-tight text-blue-400">CyberShield AI Dashboard</h1>
    <div class="bg-blue-600 px-4 py-2 rounded-full text-sm">
      Role: {{ role }}
    </div>
  </header>

  <section class="flex-1 bg-gray-800 p-8 rounded-2xl shadow-xl">
    <h2 class="text-2xl font-semibold mb-6">Available Actions</h2>

    {% if actions %}
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        {% for action in actions %}
          <button 
            title="Perform {{ action }}"
            class="bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-400/50 py-3 px-5 rounded-xl font-semibold transition text-lg w-full"
          >
            {{ action | capitalize }}
          </button>
        {% endfor %}
      </div>
    {% else %}
      <div class="text-center text-gray-400 py-12">
        <p class="text-lg">No actions available for this role yet.</p>
      </div>
    {% endif %}
  </section>

  <footer class="mt-10 text-center text-gray-500 text-sm">
    © {{ current_year }} CyberShield AI. All rights reserved.
  </footer>

</body>
</html>
