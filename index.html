<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>CyberShield AI Enterprise</title>

    <meta
        name="description"
        content="CyberShield AI Enterprise - Advanced File Scanning, Threat Detection and Security Monitoring Platform."
    />

    <meta
        name="theme-color"
        content="#0a0f1f"
    />

    <meta
        name="robots"
        content="index,follow"
    />

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <style>
        :root {
            --bg-primary: #050816;
            --bg-secondary: #0f172a;
            --accent: #00e5ff;
            --accent-secondary: #7c3aed;
            --text: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background:
                radial-gradient(circle at top left,
                    rgba(0, 229, 255, 0.15),
                    transparent 40%),
                radial-gradient(circle at bottom right,
                    rgba(124, 58, 237, 0.15),
                    transparent 40%),
                var(--bg-primary);

            color: var(--text);
            font-family: "Inter", sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);

            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        #root {
            min-height: 100vh;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 0 0 25px rgba(0,229,255,.7);
        }

        .subtitle {
            margin-top: 12px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .loader {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-top: 30px;

            border: 4px solid rgba(255,255,255,.1);
            border-top: 4px solid var(--accent);

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="root">
        <div class="loading-screen">
            <div class="logo">CYBERSHIELD AI</div>

            <div class="subtitle">
                Enterprise Security Platform
            </div>

            <div class="loader"></div>
        </div>
    </div>

    <script
        type="module"
        src="/src/main.jsx"
    ></script>

</body>

</html>
